# PLT-09 (T02) — PostgreSQL de pruebas reproducible.
# Imagen `postgres:16` (licencia PostgreSQL, permisiva y similar a BSD/MIT).
# Solo datos sintéticos; nunca datos reales de pacientes.
#
# Uso local:
#   docker compose -f docker-compose.test.yml up -d
#   export DATABASE_URL_TEST=postgresql://postgres:postgres@localhost:5434/optisaas_pruebas
#   npm run test:int --prefix web
#
# En CI lo provee el servicio `postgres` de `.github/workflows/ci.yml`
# (misma imagen y credenciales, puerto 5432 del servicio).
#
# TODO(Q-09): las condiciones gratuitas de GitHub Actions y las herramientas
# de infraestructura del SO están pendientes de decisión de Orlando; por eso
# existe también `npm run ci:local` en `web/package.json`, que ejecuta lo mismo
# sin depender de la nube.
name: optisaas-pruebas
services:
  postgres-pruebas:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: optisaas_pruebas
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d optisaas_pruebas"]
      interval: 5s
      timeout: 5s
      retries: 10

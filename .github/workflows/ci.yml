name: CI

on:
  pull_request:
  push:
    branches:
      - cursor/feat-t00-reglas-spec-b7f3
      - main
      - master

jobs:
  calidad:
    name: lint + typecheck + pruebas + licencias + build + e2e
    runs-on: ubuntu-latest
    # PLT-09 (T02): PostgreSQL real para las pruebas de integración
    # (imagen postgres:16, licencia PostgreSQL). Sin secretos de pago ni
    # servicios de terceros.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: optisaas_pruebas
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/optisaas_pruebas
      # PLT-02 (T03): la app E2E (`/nucleo`) persiste contra el mismo servicio.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/optisaas_pruebas
    defaults:
      run:
        working-directory: web
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Fijar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias (sin postinstall de terceros)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Buscar secretos en el repositorio (SEG-12)
        run: npm run secretos:buscar

      - name: Typecheck
        run: npm run typecheck

      - name: Pruebas (node:test de T01 + unitarias Vitest)
        run: npm test

      - name: Cliente PostgreSQL (pg_dump y psql, licencia PostgreSQL)
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y postgresql-client

      - name: Pruebas de integración (PostgreSQL real)
        run: npm run test:int

      - name: Auditoría de licencias (PLT-09)
        run: npm run licenses:check

      - name: Catálogos CIE-10 y CUPS no redistribuidos (OPT-10)
        run: npm run catalogos:check

      - name: Build de producción
        run: npm run build

      - name: Migrar esquema núcleo (PLT-02)
        run: npm run db:migrate

      - name: Verificación RLS multi-tenant (PLT-01)
        run: npm run db:check-rls

      - name: Recifrar secretos MFA legados (SEG-12)
        run: npm run cifrado:recifrar-mfa

      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: Generar AUTH_SECRET efímero (solo E2E, sin valor real)
        run: echo "AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Generar cuentas locales de desarrollo (PLT-10, T05)
        run: npm run seed:dev

      - name: Pruebas E2E (/login, /nucleo, demo, entornos)
        run: npm run test:e2e
